version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_pass}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_atlas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_atlas"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus_net

  # ─── Redis (cache / task queue) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - nexus_net

  # ─── Backend FastAPI ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus_pass}@postgres:5432/${POSTGRES_DB:-nexus_atlas}
      REDIS_URL: redis://redis:6379
    volumes:
      - ./scans:/app/scans
      - ./reports:/app/reports
      - ./ai_models:/app/ai_models
      - ./geospatial:/app/geospatial
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nexus_net

  # ─── Frontend React ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_API_URL: /api
    container_name: nexus_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nexus_net

volumes:
  postgres_data:
  redis_data:

networks:
  nexus_net:
    driver: bridge
