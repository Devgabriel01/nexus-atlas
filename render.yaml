services:
  - type: web
    name: nexus-atlas-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend.render
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false              # set manually with Neon connection string
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://nexus-atlas-frontend.onrender.com"

  - type: web
    name: nexus-atlas-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexus-atlas-backend.onrender.com
      - key: VITE_MAPBOX_TOKEN
        sync: false
