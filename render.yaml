services:
  - type: web
    name: nexus-atlas-backend
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.backend.prod
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-pg
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GEE_PROJECT
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://nexus-atlas-frontend.onrender.com"

  - type: web
    name: nexus-atlas-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexus-atlas-backend.onrender.com
      - key: VITE_MAPBOX_TOKEN
        sync: false

databases:
  - name: nexus-pg
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: []  # only allow internal connections
